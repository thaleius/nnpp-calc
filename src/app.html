<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark;">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">

		<script>

		</script>

		<div id="initial-loader" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: black; transition: opacity 100ms ease-out;">
			<div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
				<div style="width: 48px; height: 48px; box-sizing: border-box; border: 4px solid #3b3b3b; border-top-color: #fdba74; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <span style="color: #fdba74; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 24px; font-weight: 500; margin: 0; padding: 0;">
					Loading
					<span class="dots" style="display: inline-block; width: 16px; text-align: left;"></span>
				</span>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

			@keyframes dots {
				0%, 20% { content: ""; }
				40% { content: "."; }
				60% { content: ".."; }
				80%, 100% { content: "..."; }
			}
			
			.dots::after {
				content: "";
				animation: dots 1.5s infinite;
			}
    </style>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
